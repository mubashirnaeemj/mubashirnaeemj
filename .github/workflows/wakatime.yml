name: Waka Readme

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update WakaTime block
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
        run: python scripts/update_waka.py

      - name: Commit changes
        run: |
          git config user.name "mubashirnaeemj"
          git config user.email "mubashirnaeemj@gmail.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update WakaTime stats"
          git push